name: Test setup-helm-docs
description: >
  Just a test for setup-helm-docs
inputs:
  expected-version:
    description: 'Version of helm-docs'
    required: false
runs:
  using: composite
  steps:
    - name: Check helm-docs version
      shell: bash
      run: |
        [ "$(helm-docs -v | awk '{print $NF}')" = "${INPUTS_EXPECTED_VERSION}" ]
      env:
        INPUTS_EXPECTED_VERSION: ${{ inputs.expected-version }}
