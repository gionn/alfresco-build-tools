name: 'Github https authentication'
description: 'Configure git to use http credentials for accessing private repositories'
inputs:
  username:
    description: 'The username of the account'
    required: true
  pat:
    description: 'The token of the account'
    required: true
runs:
  using: "composite"
  steps:
    - name: Configure git to use bot credentials
      run: git config --global url."https://${INPUTS_USERNAME}:${INPUTS_PAT}@github.com".insteadOf "https://github.com"
      shell: bash
      env:
        INPUTS_USERNAME: ${{ inputs.username }}
        INPUTS_PAT: ${{ inputs.pat }}
