# https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions
name: 'jx-updatebot-pr'
description: |
  Create a Pull Request on each downstream repository
  See: https://github.com/jenkins-x-plugins/jx-updatebot
branding:
  icon: 'git-pull-request'
  color: 'blue'
inputs:
  auto-merge:
    required: false
    description: should we automatically merge if the PR pipeline is green (default true)
    default: 'true'
  version:
    required: false
    description: the version number to promote. If not specified uses $VERSION environment variable or the version file
  version-file:
    required: false
    description: the file to load the version from if not specified directly or via a $VERSION environment variable. Defaults to VERSION in the current dir
    default: 'VERSION'
  dir:
    required: false
    description: the directory to look for the VERSION file (default ".")
    default: '.'
  pull-request-title:
    required: false
    description: the PR title
    default: ''
  commit-title:
    required: false
    description: the commit title
    default: ''
  commit-message:
    required: false
    description: the commit message
    default: ''
  pull-request-body:
    required: false
    description: the PR body
    default: ''
  labels:
    required: false
    description: a list of labels to apply to the PR separated by comma, i.e l1,l2,l3
    default: ''
  base-branch-name:
    required: false
    description: the base branch name to use for new pull requests. Defaults to default main branch if not specified.
    default: ''
  flags:
    required: false
    description: Command options, i.e. --git-credentials
    default: ''
  config-file:
    required: false
    description: the updatebot config file. If none specified defaults to .jx/updatebot.yaml
    default: ''
  git-token:
    description: the git token used to operate on the git repository. If not specified it's loaded from the git credentials file
    required: false
    default: ''
  git-username:
    description: the git username used to operate on the git repository. If not specified it's loaded from the git credentials file
    required: false
    default: ''
  git-author-name:
    description: the user name to git commit
    required: false
    default: ''
  git-author-email:
    description: the user email to git commit
    required: false
    default: ''
  jx-updatebot-release:
    description: the version of jx-updatebot release binary.
    required: false
    default: '0.3.13'
  working-directory:
    required: false
    description: project root directory. Defaults to '.'
    default: '.'
runs:
  using: composite
  steps:
    - name: Setup jx-updatebot
      run: |
        curl -L https://github.com/jenkins-x-plugins/jx-updatebot/releases/download/v${INPUTS_JX_UPDATEBOT_RELEASE}/jx-updatebot-linux-amd64.tar.gz | tar xzv
        sudo mv jx-updatebot /usr/local/bin
      shell: bash
      working-directory: /tmp
      env:
        INPUTS_JX_UPDATEBOT_RELEASE: ${{ inputs.jx-updatebot-release }}
    - name: Run jx-updatebot
      run: >
        jx-updatebot pr
        --auto-merge=${INPUTS_AUTO_MERGE}
        --version='${INPUTS_VERSION}'
        --pull-request-title='${INPUTS_PULL_REQUEST_TITLE}'
        --pull-request-body="${INPUTS_PULL_REQUEST_BODY}"
        --commit-title='${INPUTS_COMMIT_TITLE}'
        --commit-message="${INPUTS_COMMIT_MESSAGE}"
        --labels='${INPUTS_LABELS}'
        --base-branch-name='${INPUTS_BASE_BRANCH_NAME}'
        --config-file='${INPUTS_CONFIG_FILE}'
        --version-file='${INPUTS_VERSION_FILE}'
        --dir='${INPUTS_DIR}'
        ${INPUTS_FLAGS}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GIT_USERNAME: ${{ inputs.git-username }}
        GIT_TOKEN: ${{ inputs.git-token }}
        GIT_AUTHOR_NAME: ${{ inputs.git-author-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-author-email }}
        INPUTS_AUTO_MERGE: ${{ inputs.auto-merge }}
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_PULL_REQUEST_TITLE: ${{ inputs.pull-request-title }}
        INPUTS_PULL_REQUEST_BODY: ${{ inputs.pull-request-body }}
        INPUTS_COMMIT_TITLE: ${{ inputs.commit-title }}
        INPUTS_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        INPUTS_LABELS: ${{ inputs.labels }}
        INPUTS_BASE_BRANCH_NAME: ${{ inputs.base-branch-name }}
        INPUTS_CONFIG_FILE: ${{ inputs.config-file }}
        INPUTS_VERSION_FILE: ${{ inputs.version-file }}
        INPUTS_DIR: ${{ inputs.dir }}
        INPUTS_FLAGS: ${{ inputs.flags }}
