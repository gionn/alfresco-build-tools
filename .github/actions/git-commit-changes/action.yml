name: "Commit changes"
description: "Commit current changes"
inputs:
  username:
    description: "The username to be set as global user"
    required: true
  add-options:
    description: "Options to be added to `git add`"
    required: true
  commit-message:
    description: "The commit message to be used while committing"
    required: true
  repository-directory:
    description: "Path to the the directory holding the git repository"
    required: false
  commit-options:
    description: "Additional Git commit command options"
    required: false
    default: ''
  skip-if-no-changes:
    description: "Skips the actual commit when no changes are staged"
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Commit stagged changes
      shell: bash
      run: |
        REPO_DIR="${INPUTS_REPOSITORY_DIRECTORY}"
        if [ -n "$REPO_DIR" ]
        then
          cd $REPO_DIR
        fi
        git config --global user.name ${INPUTS_USERNAME}
        git config --global user.email ${INPUTS_USERNAME}@users.noreply.github.com
        git add ${INPUTS_ADD_OPTIONS}
        git status
        git --no-pager diff --cached
        if ${{ inputs.skip-if-no-changes == 'true' }} ;
        then
          git diff-index --quiet HEAD || git commit -m "${INPUTS_COMMIT_MESSAGE}" ${INPUTS_COMMIT_OPTIONS}
        else
          git commit -m "${INPUTS_COMMIT_MESSAGE}" ${INPUTS_COMMIT_OPTIONS}
        fi
      env:
        INPUTS_REPOSITORY_DIRECTORY: ${{inputs.repository-directory}}
        INPUTS_USERNAME: ${{ inputs.username }}
        INPUTS_ADD_OPTIONS: ${{ inputs.add-options }}
        INPUTS_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        INPUTS_COMMIT_OPTIONS: ${{ inputs.commit-options }}
