name: "Build helm chart"
description: "Build helm chart by running `helm up` and `helm lint`"
inputs:
  chart-dir:
    description: "Path to the folder holding Chart.yaml"
    required: true

runs:
  using: composite
  steps:
    - name: Build and lint
      shell: bash
      run: |
        helm dep up ${INPUTS_CHART_DIR}
        helm lint ${INPUTS_CHART_DIR}
      env:
        INPUTS_CHART_DIR: ${{ inputs.chart-dir }}
